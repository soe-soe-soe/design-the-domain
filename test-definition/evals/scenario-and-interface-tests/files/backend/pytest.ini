[pytest]
# Test Discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async Configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers für Test-Kategorien
markers =
    unit: Unit tests (fast, isolated, mocked dependencies)
    integration: Integration tests (database, multiple components)
    e2e: End-to-end tests (full application flow)
    service: Service layer tests
    repository: Repository and Database tests
    client: External API client tests
    middleware: Middleware tests
    security: Security and authentication tests
    slow: Tests that take longer to run
    external_api: Tests that call external APIs (should be mocked in unit tests)
    workflow: Workflow integration tests (cross-domain operations)
    database: Database-specific integration tests
    cross_domain: Cross-domain integration tests (multiple domains involved)
    fr(ref): Functional requirement scenario in domain-model/problem-space/ that this test proves, e.g. fr("FR-fristen-001/S2")
    story(ref): Story whose facade change this interface test checks, e.g. story("US-0042") (ADR 012)

# Output & Reporting
addopts =
    -v
    --strict-markers
    --tb=short
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

# Filter Warnings
filterwarnings =
    ignore::PendingDeprecationWarning:starlette.formparsers
    ignore::RuntimeWarning:pyogrio.raw
    ignore::DeprecationWarning:sqlalchemy
    ignore:The `dict` method is deprecated; use `model_dump` instead

# Coverage Configuration
[coverage:run]
source = domain,core
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*
    */scripts/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Logging während Tests
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

